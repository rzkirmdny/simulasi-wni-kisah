<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Dajjal Part 1</title>
<style>
  @font-face { font-family: "SG"; src: url("fonts/space-grotesk-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: "SG"; src: url("fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
  html, body { margin: 0; padding: 0; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  #stage canvas { position: absolute; inset: 0; }
  .ov { position: absolute; left: 150px; width: 780px; text-align: center; font-family: "SG", sans-serif; color: #fff; pointer-events: none; }
  #hook { top: 250px; font-weight: 700; font-size: 88px; line-height: 1.02; letter-spacing: -1px; text-transform: uppercase;
          text-shadow: 0 6px 30px rgba(0,0,0,.9), 0 2px 0 rgba(0,0,0,.6); }
  #hook b { color: #ff5a3c; font-weight: 700; }
  #title { top: 760px; font-weight: 700; font-size: 72px; letter-spacing: 6px; text-transform: uppercase; text-shadow: 0 4px 24px rgba(0,0,0,.95); }
  #title small { display: block; font-size: 36px; letter-spacing: 3px; font-weight: 500; color: #f3c58a; margin-top: 18px; }
  #name { top: 0; font-weight: 700; font-size: 40px; letter-spacing: 4px; color: #ffd9a0; text-shadow: 0 3px 18px rgba(0,0,0,.95); }
  #capwrap { top: 1270px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #role { font-weight: 700; font-size: 26px; letter-spacing: 3px; padding: 6px 16px; border-radius: 8px; color: #120a06; }
  #cap { font-weight: 700; font-size: 54px; line-height: 1.14; padding: 10px 22px; border-radius: 14px;
         background: rgba(12, 6, 3, .58); text-shadow: 0 2px 10px rgba(0,0,0,.8); }
  #end { top: 1500px; font-weight: 700; font-size: 44px; letter-spacing: 4px; text-transform: uppercase; color: #ffd9a0;
         text-shadow: 0 4px 24px rgba(0,0,0,.95); }
</style>
</head>
<body>
<div id="stage">
  <div id="hook" class="ov"></div>
  <div id="title" class="ov"></div>
  <div id="name" class="ov"></div>
  <div id="capwrap" class="ov"><div id="role"></div><div id="cap"></div></div>
  <div id="end" class="ov"></div>
</div>
<script type="module" src="scene.js"></script>
</body>
</html>
